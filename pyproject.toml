[project]
name = "pyorb"
authors = [
  { name="Yuman Hordijk", email="y.hordijk@vu.nl"},
  { name="Tori Gijzen", email="t.gijzen@vu.nl"},
  { name="Steven E. Beutick", email="s.e.beutick@vu.nl"}]
description = "PyOrb is an automated orbital analysis tool used in the TheoCheM group at VU Amsterdam"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"]
dynamic = ["version"]

[build-system]
requires = ["setuptools==63.4.3", "wheel", "setuptools-git-versioning<2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools-git-versioning]
enabled = true
template = "{tag}"
dev_template = "{tag}"
dirty_template = "{tag}"
