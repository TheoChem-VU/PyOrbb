name: Package distributions

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: "packaging"

jobs:
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase
      - name: Build the app
        run: |
          chmod +x build_macos_app.sh
          ./build_macos_app.sh
      - name: Upload distributions to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: dist/PyOrbb.dmg
          asset_name: PyOrbb-${{ github.ref_name}}-macOS-ARM.dmg
          tag: ${{ github.ref }}
          overwrite: true

  macos-intel-build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase
      - name: Build the app
        run: |
          chmod +x build_macos_app.sh
          ./build_macos_app.sh
      - name: Upload distributions to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: dist/PyOrbb.dmg
          asset_name: PyOrbb-${{ github.ref_name}}-macOS-Intel.dmg
          tag: ${{ github.ref }}
          overwrite: true

  arch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase
      - name: Build the app
        run: |
          sudo apt install python3.11
          sudo apt -y install socat
          sed -i "s/%REPLACE_VERSION/$(git describe --tags --abbrev=0 | cut -c 2-)/g" pyproject.toml
          git describe --tags --abbrev=0 | cut -c 2- > src/pyorbb/VERSION
          # briefcase create --no-input
          briefcase build -r --target archlinux:latest
          briefcase package --adhoc-sign --target archlinux:latest
          mv dist/pyorbb*.pkg.tar.zst dist/PyOrbb.pkg.tar.zst
      - name: Upload distributions to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: dist/PyOrbb.pkg.tar.zst
          asset_name: PyOrbb-${{ github.ref_name}}-ArchLinux.pkg.tar.zst
          tag: ${{ github.ref }}
          overwrite: true

  ubuntu-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase
      - name: Build the app
        run: |
          chmod +x build_ubuntu_app.sh
          ./build_ubuntu_app.sh
      - name: Upload distributions to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: dist/PyOrbb.deb
          asset_name: PyOrbb-${{ github.ref_name}}-Ubuntu-Intel.deb
          tag: ${{ github.ref }}
          overwrite: true

  ubuntu-arm-build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase
      - name: Build the app
        run: |
          chmod +x build_ubuntu_app.sh
          ./build_ubuntu_app.sh
      - name: Upload distributions to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: dist/PyOrbb.deb
          asset_name: PyOrbb-${{ github.ref_name}}-Ubuntu-ARM.deb
          tag: ${{ github.ref }}
          overwrite: true

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase
      - name: Install Cygwin Action
        uses: cygwin/cygwin-install-action@v6
      - name: Build the app
        run: |
          chmod +x build_windows_app.sh
          bash build_windows_app.sh
      - name: Upload distributions to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: dist/PyOrbb.msi
          asset_name: PyOrbb-${{ github.ref_name}}-Windows.msi
          tag: ${{ github.ref }}
          overwrite: true
