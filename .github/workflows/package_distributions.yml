name: Package distributions

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: "publishing"
  cancel-in-progress: true

jobs:
  distribution:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: dist/PyOrbb-0.0.0.msi
            asset_name: PyOrbb-${{ github.ref}}-Windows
          - os: macos-latest
            artifact_name: dist/PyOrbb-0.0.0.dmg
            asset_name: PyOrbb-${{ github.ref}}-macOS
        
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase
      - name: Build the app
        run: |
          briefcase build -r
      - name: Package the app
        run: |
          briefcase package --adhoc-sign
      - name: Upload distributions to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: $ {{ matrix.artifact_name }}
          asset_name: $ {{matrix.asset_name }}
          tag: ${{ github.ref }}
          overwrite: true
