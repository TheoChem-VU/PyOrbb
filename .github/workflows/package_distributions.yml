name: Package distributions

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: "packaging"

jobs:
  macos-build:
    # - os: windows-latest
    #   artifact_name: dist/PyOrbb-0.0.0.msi
    #   asset_name: PyOrbb-${{ github.ref_name}}-Windows.msi
    #   build_sh: build_windows_app.sh
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase
      - name: Build the app
        run: |
          chmod +x build_macos_app.sh
          ./build_macos_app.sh
      - name: Upload distributions to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: dist/PyOrbb.dmg
          asset_name: PyOrbb-${{ github.ref_name}}-macOS.dmg
          tag: ${{ github.ref }}
          overwrite: true

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase
      - name: Build the app
        run: |
          briefcase build -r
          briefcase package --adhoc-sign
      - name: Upload distributions to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: dist/PyOrbb-0.0.0.msi
          asset_name: PyOrbb-${{ github.ref_name}}-Windows.msi
          tag: ${{ github.ref }}
          overwrite: true
